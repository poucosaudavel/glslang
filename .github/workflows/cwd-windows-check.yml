# Temporary check (not for upstream): run the standalone glslang from a folder whose name is outside the
# runner's ANSI code page (1252), at upstream main and with the fix.
name: Working directory outside the code page
on:
  push:
    branches: [cwd-windows-check]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: upstream main
            ref: 6334e1549a49989e04b5329a6a39a328247fd6ed
          - name: with the fix
            ref: 2271338200f70b987fed9d42ca4966a534448768
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Build glslang (standalone)
        run: |
          cmake -S . -B build -DENABLE_OPT=OFF -DGLSLANG_TESTS=OFF
          cmake --build build --config Release --target glslang-standalone --parallel
      - name: Compile a shader from an ASCII, an accented-Latin and a CJK-named folder
        shell: pwsh
        run: |
          $exe = (Resolve-Path build/StandAlone/Release/glslang.exe).Path
          "ANSI code page: " + (Get-ItemPropertyValue "HKLM:\SYSTEM\CurrentControlSet\Control\Nls\CodePage" ACP)
          $shader = "#version 450`nlayout(location = 0) out vec4 color;`nvoid main() { color = vec4(1.0); }`n"
          $failed = $false
          foreach ($dir in @("$env:RUNNER_TEMP\ascii folder", "$env:RUNNER_TEMP\Pasta João", "$env:RUNNER_TEMP\测试 folder")) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Set-Content -LiteralPath (Join-Path $dir "test.frag") -Value $shader -Encoding ascii -NoNewline
            Push-Location -LiteralPath $dir
            foreach ($extra in @(@(), @("-g"), @("-gV"))) {
              Remove-Item -ErrorAction SilentlyContinue out.spv
              & $exe -V @extra -o out.spv test.frag
              $code = $LASTEXITCODE
              $size = if (Test-Path out.spv) { (Get-Item out.spv).Length } else { 0 }
              $hash = if ($size -gt 0) { (Get-FileHash -Algorithm SHA256 out.spv).Hash.Substring(0, 16) } else { "-" }
              $hasCwd = $false
              if ($size -gt 0) { $hasCwd = [System.Text.Encoding]::Latin1.GetString([IO.File]::ReadAllBytes("$dir\out.spv")).Contains("_temp") }
              "RESULT {0} | -V {1} | exit 0x{2:X8} | {3} bytes | sha {4} | cwd recorded: {5}" -f (Split-Path -Leaf $dir), ($extra -join ' '), $code, $size, $hash, $hasCwd
              if ($code -ne 0 -or $size -eq 0) { $failed = $true }
            }
            Pop-Location
          }
          if ($failed) { throw "glslang failed in at least one folder" }
